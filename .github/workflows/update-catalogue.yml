name: Update paint catalogue

# Once a month: pull the latest paint data from Paintdex (MIT, community-maintained)
# and open a pull request when something changed. Merging it rebuilds the image.
on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update catalogue from Paintdex
        id: update
        run: |
          node scripts/update-catalogue.js | tee update.log
          {
            echo "summary<<EOF"
            cat update.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm update.log
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: catalogue-update
          delete-branch: true
          commit-message: "Update paint catalogue from Paintdex"
          title: "Farbkatalog aktualisieren (Paintdex)"
          body: |
            Automatische Aktualisierung aus https://github.com/s10-steve/paintdex

            ```
            ${{ steps.update.outputs.summary }}
            ```

            Bestehende Einträge behalten Name, Hex, Sammlung und Linie (eigene Farben und
            Einkaufslisten bleiben gültig). Nach dem Merge baut GitHub Actions das Image neu;
            danach in Portainer den Stack mit „Re-pull image“ aktualisieren.
